model:
  # Core Architecture - Precisely calibrated for 27M parameters
  vocab_size: 3788          # Use actual tokenizer vocab size
  d_model: 512              # Sweet spot for 27M target
  n_layers_high: 4          # High-level planning layers
  n_layers_low: 6           # Reduced to fit parameter budget
  n_heads: 8                # 512 / 8 = 64 per head
  d_ff: 2048                # 4 * d_model
  max_sequence_length: 4096
  dropout: 0.1
  layer_norm_epsilon: 1e-5
  
  # HRM-Specific Parameters
  reasoning_steps: 8
  halt_threshold: 0.85
  high_level_timescale: 2
  cross_hierarchy_dim: 192
  reasoning_head_dim: 96
  
  # Additional Configuration
  use_flash_attention: true
