model:
  # Core Architecture
  vocab_size: 32000
  d_model: 512
  n_layers_high: 4
  n_layers_low: 8
  n_heads: 8
  d_ff: 1536
  max_sequence_length: 4096
  dropout: 0.1
  layer_norm_epsilon: 1e-5
  
  # HRM-Specific Parameters
  reasoning_steps: 8
  halt_threshold: 0.85
  high_level_timescale: 2
  cross_hierarchy_dim: 192
  reasoning_head_dim: 96
  
  # Additional Configuration
  use_flash_attention: true
