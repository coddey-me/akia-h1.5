training:
  # Experiment Setup
  experiment_name: "akia-hrm-v1.4"
  data_path: "data/processed/akia_training_data.pkl"
  
  # Batch Configuration - Reduced for memory
  batch_size: 8                # Reduced from 8 to 2
  gradient_accumulation_steps: 16  # Increased to maintain effective batch size
  effective_batch_size: 32
  
  # Optimization - Ensure values are numbers, not strings
  learning_rate: 0.0001        # 1e-4 as float
  min_learning_rate: 0.000001  # 1e-6 as float
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  epsilon: 0.00000001          # 1e-8 as float
  
  # Training Schedule
  max_epochs: 3
  warmup_steps: 50
  
  # Evaluation and Logging
  eval_steps: 25
  save_steps: 50
  logging_steps: 5
  
  # Data Configuration - Reduced sequence length
  train_split: 0.9
  val_split: 0.1
  max_sequence_length: 512     # Reduced from 1024 to 512
  
  # Performance Optimization
  mixed_precision: false        # Keep disabled
  dataloader_num_workers: 0     # Reduced from 2 to 0
  pin_memory: false            # Disabled to save memory
  
  # Model-specific - Reduced reasoning steps
  reasoning_steps_train: 3     # Reduced from 6 to 3
  reasoning_steps_eval: 5      # Reduced from 8 to 5
  
  # Weights & Biases
  use_wandb: true
  wandb_project: "akia-hrm"
