training:
  # Experiment Setup
  experiment_name: "akia-hrm-v1.4"
  data_path: "data/processed/akia_training_data.pkl"
  
  # Batch Configuration
  batch_size: 8
  gradient_accumulation_steps: 4
  effective_batch_size: 32
  
  # Optimization - Ensure values are numbers, not strings
  learning_rate: 0.0001        # 1e-4 as float
  min_learning_rate: 0.000001  # 1e-6 as float
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  epsilon: 0.00000001          # 1e-8 as float
  
  # Training Schedule
  max_epochs: 25
  warmup_steps: 500
  
  # Evaluation and Logging
  eval_steps: 250
  save_steps: 500
  logging_steps: 50
  
  # Data Configuration
  train_split: 0.9
  val_split: 0.1
  max_sequence_length: 1024
  
  # Performance Optimization
  mixed_precision: true
  dataloader_num_workers: 2
  pin_memory: true
  
  # Model-specific
  reasoning_steps_train: 6
  reasoning_steps_eval: 8
  
  # Weights & Biases
  use_wandb: true
  wandb_project: "akia-hrm"
